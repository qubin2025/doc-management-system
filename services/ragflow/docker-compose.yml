# RAGFlow 知识库引擎 — 独立 Docker Compose
# 启动: docker compose -f services/ragflow/docker-compose.yml up -d
# 管理: http://localhost:9380 (RAGFlow Web UI)
# API:  http://localhost:9380/api/v1/

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ragflow-es
    restart: unless-stopped
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  mysql:
    image: mysql:8.0
    container_name: ragflow-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=infini_rag_flow
      - MYSQL_DATABASE=rag_flow
      - MYSQL_USER=rag_flow
      - MYSQL_PASSWORD=infini_rag_flow
    ports:
      - "127.0.0.1:5455:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: quay.io/minio/minio:latest
    container_name: ragflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=rag_flow
      - MINIO_ROOT_PASSWORD=infini_rag_flow
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio-data:/data

  redis:
    image: valkey/valkey:8-alpine
    container_name: ragflow-redis
    restart: unless-stopped
    command: valkey-server --requirepass infini_rag_flow
    ports:
      - "127.0.0.1:6389:6379"

  ragflow:
    image: infiniflow/ragflow:v0.17.0
    container_name: ragflow-server
    restart: unless-stopped
    depends_on:
      - es01
      - mysql
      - minio
      - redis
    ports:
      - "127.0.0.1:9380:9380"
      - "127.0.0.1:9381:80"
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=infini_rag_flow
    volumes:
      - ragflow-data:/ragflow/logs

volumes:
  es-data:
  mysql-data:
  minio-data:
  ragflow-data:
