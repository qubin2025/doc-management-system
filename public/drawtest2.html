<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Draw.io Local Test</title></head>
<body style="margin:20px;font-family:sans-serif">
<h2>Local Draw.io Test</h2>
<iframe id="dio" src="/drawio/index.html?embed=1&proto=json" style="width:100%;height:600px;border:2px solid #333"></iframe>
<script>
var log = document.createElement('div'); log.id='log'; log.style.cssText='margin-top:10px;padding:10px;background:#f0f0f0;font:12px monospace';
document.body.appendChild(log);
window.addEventListener('message', function(e) {
  var msg; try { msg = JSON.parse(e.data); } catch(ex) { return; }
  log.innerHTML += new Date().toLocaleTimeString() + ' - ' + msg.event + '<br>';
});
</script>
</body></html>
