name: CI — Build & Test

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: backend
      - run: node -e "
          const {getDb} = require('./db.js');
          const db = getDb();
          console.log('DB init OK, tables:', db.prepare('SELECT name FROM sqlite_master WHERE type=\"table\"').all().length);
        "
        working-directory: backend
