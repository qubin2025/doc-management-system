# 全过程工程咨询管理系统 — Docker Compose
version: '3.8'

services:
  # 后端 API 服务
  backend:
    build: .
    container_name: doc-mgmt-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - db-data:/app/backend/data
      - files-data:/app/backend/files
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data/planning.db
      - FILES_PATH=/app/backend/files
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: doc-mgmt-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"   # 仅监听本机，生产建议前置反向代理+HTTPS；如需直接外网访问改为 80:80
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  files-data:
