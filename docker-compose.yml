# 全过程工程咨询管理系统 — Docker Compose
# 一键启动: docker compose up -d
# 最小部署: docker compose up -d backend nginx (无需Python/Docker依赖)
# 完整部署: docker compose up -d (含Neo4j+LightRAG+PaddleOCR)
name: docmgmt

services:
  # 后端 API 服务 (必选)
  backend:
    build: .
    container_name: doc-mgmt-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - db-data:/app/backend/data
      - files-data:/app/backend/files
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data/planning.db
      - FILES_PATH=/app/backend/files
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # v6.0: 日志前缀环境区分（PROD 标识会拼接到所有日志前缀）
      - LOG_PREFIX_DOC_LIST=${LOG_PREFIX_DOC_LIST:-DOC-LIST}
      - LOG_PREFIX_DOC_DOWNLOAD=${LOG_PREFIX_DOC_DOWNLOAD:-DOC-DL}
      - LOG_ENV_TAG=${LOG_ENV_TAG:-PROD}
      # Neo4j 连接（指向 compose 内的 neo4j 服务）
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme123}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理（前端静态文件 + API代理 + PWA支持）
  nginx:
    image: nginx:alpine
    container_name: doc-mgmt-nginx
    restart: unless-stopped
    ports:
      - "80:80"   # 外网可访问（移动端PWA安装需要同一IP）
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Neo4j 图数据库（知识图谱引擎）
  neo4j:
    image: neo4j:5-community
    container_name: doc-mgmt-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme123}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LightRAG 知识引擎（方案B — Python微服务）
  lightrag:
    build: ./services/lightrag-server
    container_name: doc-mgmt-lightrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lightrag-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/lightrag/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LIGHTRAG_PORT=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama 本地大模型（可选，离线AI能力）
  ollama:
    image: ollama/ollama:latest
    container_name: doc-mgmt-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - full     # 仅完整部署时启动
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PaddleOCR 文档解析服务（全局解析入口）
  paddleocr:
    build: ./services/paddleocr-server
    container_name: doc-mgmt-paddleocr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PADDLEOCR_PORT=8001
    volumes:
      - paddleocr-cache:/root/.paddleocr
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/api/parse/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  files-data:
  neo4j-data:
  neo4j-logs:
  lightrag-data:
  paddleocr-cache:
  ollama-data:
