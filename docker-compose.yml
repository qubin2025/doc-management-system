# 全过程工程咨询管理系统 — Docker Compose
version: '3.8'

services:
  # 后端 API 服务
  backend:
    build: .
    container_name: doc-mgmt-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - db-data:/app/backend/data
      - files-data:/app/backend/files
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data/planning.db
      - FILES_PATH=/app/backend/files
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: doc-mgmt-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"   # 仅监听本机，生产建议前置反向代理+HTTPS；如需直接外网访问改为 80:80
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Neo4j 图数据库（知识图谱引擎）
  neo4j:
    image: neo4j:5-community
    container_name: doc-mgmt-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme123}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LightRAG 知识引擎（方案B）
  lightrag:
    build: ./services/lightrag-server
    container_name: doc-mgmt-lightrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lightrag-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  files-data:
  neo4j-data:
  neo4j-logs:
  lightrag-data:
