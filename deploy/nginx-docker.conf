# Nginx Docker配置 — 前端静态 + API代理 + PWA/移动端支持 + 安全头
server {
    listen 80;
    server_name _;

    # v6.0: 大文件上传支持 200MB（multipart 上传端点）
    client_max_body_size 200M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 500;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存（带hash的JS/CSS长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # 移动端 PWA 入口
    location = /mobile {
        rewrite ^ /mobile.html last;
    }

    # Service Worker（必须从根路径服务，scope=/）
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    location = /workbox-b5e39dc2.js {
        add_header Cache-Control "public, max-age=86400";
    }

    # PWA manifest（禁用缓存，确保更新即时生效）
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # SPA fallback（桌面端 + 移动端）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
