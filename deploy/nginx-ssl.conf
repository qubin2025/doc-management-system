# Nginx HTTPS + 反向代理 生产配置 v6.0
# 替换 your-domain.com 为实际域名
# Let's Encrypt: certbot --nginx -d your-domain.com
# SSL证书路径: /etc/letsencrypt/live/your-domain.com/

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL证书
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 日志
    access_log /var/log/nginx/doc-mgmt-access.log;
    error_log  /var/log/nginx/doc-mgmt-error.log warn;

    # 静态资源（前端构建产物）
    root /opt/doc-mgmt/dist;
    index index.html;

    # Gzip压缩（v6.0: 补充字体/wasm/图标类型）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # 上传文件大小限制（v6.0: 200M，支持 CAD 大图纸流式上传）
    client_max_body_size 200M;
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    # ═══════════════════════════════════════════════════════════
    # 静态资源缓存策略
    # ═══════════════════════════════════════════════════════════

    # 带 hash 的构建产物（JS/CSS/字体/图片）：长期缓存1年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PWA 图标和静态资源：缓存30天
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html：不缓存（确保用户每次拿到最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # mobile.html（PWA入口）：不缓存
    location = /mobile.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Service Worker：不缓存（确保更新及时）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ═══════════════════════════════════════════════════════════
    # API 反向代理
    # ═══════════════════════════════════════════════════════════

    # 健康检查：不记录日志，快速响应
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        proxy_read_timeout 10s;
    }

    # 大文件上传：增大缓冲区和超时
    location ~ ^/api/documents/upload(/multipart)?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 流式上传，不缓冲请求体
        proxy_read_timeout 300s;        # 大文件上传可能较慢
        proxy_send_timeout 300s;
        client_max_body_size 200M;
    }

    # 通用 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # SPA fallback（前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
