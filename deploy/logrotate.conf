# 日志轮转配置
# 安装: sudo cp deploy/logrotate.conf /etc/logrotate.d/doc-mgmt

/opt/doc-mgmt/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        systemctl reload doc-mgmt > /dev/null 2>&1 || true
    endscript
}

/var/log/doc-mgmt-backup.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
}
