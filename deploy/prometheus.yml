global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'doc-mgmt-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'

  - job_name: 'doc-mgmt-ragflow'
    static_configs:
      - targets: ['ragflow-server:9380']

  - job_name: 'doc-mgmt-easyocr'
    static_configs:
      - targets: ['paddleocr:8001']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
